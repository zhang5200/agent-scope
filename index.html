<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇小游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-labelledby="game-title">
    <section class="hero-panel">
      <p class="eyebrow">Classic Arcade</p>
      <h1 id="game-title">贪吃蛇小游戏</h1>
      <p class="intro">吃掉发光的食物让小蛇变长，避开墙壁和自己的身体。准备好刷新最高分了吗？</p>

      <div class="scoreboard" aria-label="游戏分数">
        <div>
          <span>当前分数</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span>最高分</span>
          <strong id="best-score">0</strong>
        </div>
      </div>

      <div class="actions">
        <button id="start-button" type="button">开始游戏</button>
        <button id="pause-button" type="button" disabled>暂停</button>
      </div>

      <p class="tip">电脑：方向键 / WASD 控制；手机：点击下方方向按钮。</p>
    </section>

    <section class="board-panel" aria-label="贪吃蛇游戏区域">
      <canvas id="game-board" width="480" height="480" aria-label="贪吃蛇棋盘"></canvas>
      <div id="message" class="message">点击“开始游戏”</div>

      <div class="mobile-controls" aria-label="移动端方向控制">
        <button class="control up" type="button" data-direction="up" aria-label="向上">▲</button>
        <button class="control left" type="button" data-direction="left" aria-label="向左">◀</button>
        <button class="control down" type="button" data-direction="down" aria-label="向下">▼</button>
        <button class="control right" type="button" data-direction="right" aria-label="向右">▶</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
